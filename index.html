<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Page</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at top, #ff9a9e, #fad0c4, #a1c4fd);
    background-size: 200% 200%;
    animation: bgMove 10s infinite alternate ease-in-out;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    color: white;
    text-align: center;
  }

  @keyframes bgMove {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  h1 {
    margin-top: 35px;
    font-size: 3rem;
    text-shadow: 0 0 15px #ff0057, 0 0 25px #00eaff;
    animation: glow 1.8s infinite alternate;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 15px #ff0077; }
    100% { text-shadow: 0 0 35px #00ffaa; }
  }

  /* Reduced stars for performance */
  .star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 2.5s infinite ease-in-out alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.7); }
  }

  /* Moving Quote */
  .moving-quote {
    margin-top: 12px;
    font-size: 1.3rem;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
  }

  .moving-quote span {
    display: inline-block;
    padding-left: 100%;
    animation: moveQuote 22s linear infinite, neonPulse 2.5s infinite alternate;
  }

  @keyframes moveQuote {
    from { transform: translateX(0%); }
    to { transform: translateX(-140%); }
  }

  @keyframes neonPulse {
    0% { color: #ffe4ff; text-shadow: 0 0 10px hotpink; }
    100% { color: #eaffff; text-shadow: 0 0 12px cyan; }
  }

  /* Gallery */
  .gallery {
    margin: 40px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    padding-bottom: 60px;
  }

  .photo-card {
    width: 240px;
    height: 310px;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.4);
    transition: 0.4s;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 18px rgba(255,255,255,0.20);
  }

  .photo-card:hover {
    transform: scale(1.12);
    box-shadow: 0 0 30px #fff, 0 0 40px #00ffd5;
  }

  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
  }

  .photo-card:hover img {
    transform: scale(1.15);
  }

  /* Gift Box */
  .gift-box {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 65px;
    height: 65px;
    background: linear-gradient(45deg, #ff6b6b, #feca57);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    animation: slowBounce 3s infinite ease-in-out;
  }

  @keyframes slowBounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .click-me {
    font-size: 0.6rem;
    margin-top: 3px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 2.1rem; }
    .moving-quote span { font-size: 1rem; }
    .photo-card { width: 80vw; height: 48vh; }
    .gift-box { width: 55px; height: 55px; }
    .click-me { font-size: 0.5rem; }
  }
</style>
</head>

<body>

<!-- Gift Box -->
<div class="gift-box" id="giftBox">
  🎁
  <div class="click-me">Click Me</div>
</div>

<h1>Happy Birthday to you Nisharaaaaaaa ❤️</h1>

<div class="moving-quote">
  <span>✨ May this birthday journey begin with magic, smiles, and endless happiness! ✨</span>
</div>

<!-- Gallery -->
<div class="gallery">
  <div class="photo-card" onclick="goTo('wish1.html')"><img src="1.jpg"></div>
  <div class="photo-card" onclick="goTo('wish2.html')"><img src="2.jpg"></div>
  <div class="photo-card" onclick="goTo('wish3.html')"><img src="3.jpg"></div>
  <div class="photo-card" onclick="goTo('wish4.html')"><img src="4.jpg"></div>
  <div class="photo-card" onclick="goTo('wish5.html')"><img src="5.jpg"></div>
</div>

<!-- Background Music -->
<audio id="bgm" loop>
  <source src="Index.mp3" type="audio/mpeg">
</audio>

<script>
// Play music on first touch/click
let music = document.getElementById("bgm");
let started = false;

function startMusic() {
  if (!started) {
    music.play().catch(()=>{});
    started = true;
  }
}

document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);

// Navigate pages
function goTo(page) { window.location.href = page; }

// Optimized stars (25 only)
for (let i = 0; i < 25; i++) {
  let s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random()*100 + "vw";
  s.style.top = Math.random()*100 + "vh";
  s.style.animationDuration = (1.5 + Math.random()*2) + "s";
  document.body.appendChild(s);
}

// Load confetti only when needed
const script = document.createElement("script");
script.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js";
script.defer = true;
document.body.appendChild(script);

// Gift box click → confetti
document.getElementById("giftBox").addEventListener("click", () => {
  startMusic();

  setTimeout(() => {
    confetti({
      particleCount: 180,
      spread: 60,
      origin: { y: 0.6 }
    });
  }, 100);
});
</script>

</body>
</html>
