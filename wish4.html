<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wish 4 — Royal Luxury</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Poppins',sans-serif;
    background:#080606;
    color:#f6e9d6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px;
    position:relative;
  }

  .card{
    width:920px;
    max-width:96vw;
    padding:28px;
    border-radius:14px;
    background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.25));
    border:1px solid rgba(255,215,0,0.06);
    box-shadow:0 30px 90px rgba(0,0,0,0.7);
    position:relative;
    z-index:20;
  }

  h1{
    text-align:center;
    font-size:2.4rem;
    color:#ffd86b;
    text-shadow:0 8px 40px rgba(255,200,80,0.06);
  }

  .panel{
    display:flex;
    gap:20px;
    align-items:center;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
  }

  .photo{
    width:360px;
    height:480px;
    border-radius:12px;
    overflow:hidden;
    border:6px solid rgba(255,215,0,0.12);
    box-shadow:0 30px 70px rgba(255,200,80,0.06);
  }

  .photo img{width:100%;height:100%;object-fit:cover}

  p.lead{max-width:480px;color:#f6e9d6;line-height:1.6}

  .gold-quote{
    display:inline-block;
    padding:10px 14px;
    border-radius:999px;
    background:linear-gradient(90deg,rgba(255,235,180,0.95),rgba(255,245,220,0.9));
    color:#3b2a14;
    font-weight:700;
    box-shadow:0 14px 40px rgba(255,200,80,0.08);
  }

  button{
    margin-top:12px;
    border:0;padding:10px 12px;
    border-radius:12px;
    background:#b8872e;color:#050403;
    cursor:pointer;
  }

  /* Firework sparks */
  .spark{
    position:fixed;
    width:6px;height:6px;
    border-radius:50%;
    pointer-events:none;
  }

  @media (max-width: 480px) {
  .photo-card {
    width: 80vw;
    height: 55vh;
  }

  h1 {
    font-size: 2.2rem;
  }

  .moving-quote span {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- 🔊 Background Music (auto play) -->
<audio id="bgm" src="wish4.mp3" autoplay loop></audio>

<div class="card">
  <h1>✨ Royal Birthday Wishes ✨</h1>

  <div class="panel">
    <div class="photo"><img src="wish4.jpg" alt="photo4"></div>

    <div>
      <p class="lead">
        Wishing you a majestic year ahead, filled with golden opportunities,
        grand celebrations, and the finest moments life can offer.
      </p>

      <div class="gold-quote">
        "Rule your day — celebrate in gold and grace." 👑
      </div>

      <div style="margin-top:12px">
        <button onclick="history.back()">⬅ Go Back</button>
      </div>
    </div>
  </div>
</div>


<script>
// 🎆 Firework colors
const colors = ['#ff3b3b','#ff9f1c','#ffe066','#7bf1a8','#70d6ff','#cb6ce6'];

// 🎆 Full-screen fireworks function
function burst() {
  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight;

  for (let i = 0; i < 32; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(s);

    const ang = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 160;

    s.animate(
      [
        { transform: `translate(0,0)`, opacity: 1 },
        { transform: `translate(${Math.cos(ang)*speed}px,${Math.sin(ang)*speed}px)`, opacity: 0 }
      ],
      { duration: 1800 + Math.random()*600, easing: 'cubic-bezier(.2,.8,.2,1)' }
    );

    setTimeout(()=>s.remove(), 2400);
  }
}

// 🎆 Constant fireworks around entire page
setInterval(burst, 350);  
</script>

</body>
</html>
